<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>事件冒泡注意事项</title>
</head>

<body>

    <ul id="myList">
        <li>项目1</li>
        <li>项目2</li>
        <li>项目3</li>
    </ul>

    <input type="text" id="myInput">

    <script>
        /* 
        1. 不是所有事件都会冒泡，如focus、blur、load等事件不会冒泡
        2. 可以使用event.bubbles属性检查事件是否会冒泡
        3. event.target 始终指向最初触发事件的元素
        4. event.currentTarget 指向当前正在处理事件的元素（与 this 相同）
        */

        document.getElementById('myList').addEventListener('click', function (event) {
            console.log(event.bubbles); // true 使用event.bubbles属性检查事件是否会冒泡
            console.log(event.target); // li元素 最初触发事件的元素
            console.log(event.currentTarget); // ul元素 指向当前正在处理事件的元素
            if (event.target.tagName === 'LI') {
                console.log('点击了:', event.target.textContent);
            }
        });

        document.getElementById('myInput').addEventListener('focus', function () {
            console.log(event.bubbles); // false
            console.log('输入框获得焦点');
        });


    </script>
</body>

</html>
