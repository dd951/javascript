<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>String</title>
</head>
<body>
<script>
    // 字符串类型
    // 1、单引号
    let str1 = 'hello';
    console.log(str1);
    console.log(typeof str1); // string

    // 2、双引号
    let str2 = "hello";
    console.log(str2);
    console.log(typeof str2); // string

    // 3、反引号
    let str3 = `hello`;
    console.log(str3);
    console.log(typeof str3); // string
    // 反引号支持插值表达式
    let name = '张三';
    let str4 = `你好，${name}`;
    console.log(str4);
    console.log(typeof str4); // string
</script>
</body>
</html>
