<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>location对象</title>
</head>
<body>
    <script>
        /* 
        操作 URL：
        - location.href：获取或设置完整 URL（页面跳转）。
        - location.search：获取查询字符串（如 ?id=123）。
        - location.hash：获取哈希值，现代前端框架（如Vue）的客户端路由依赖 hash。
            - url#section1 的 location.hash 的执行结果是 #section1
        - location.reload()：刷新页面。
        */
    </script>
</body>
</html>
