<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>函数定义方式的选择</title>
</head>
<body>
<script>
    // 1、函数声明
    // 1.1 需要函数提升：函数声明会提升到作用域顶部，可以在定义前调用。
    greet('Alice'); // 正常执行（函数提升）
    function greet(name) { console.log(`Hello, ${name}`); }

    // 1.2 需要命名函数（便于调试或递归）：函数声明必须有名称，堆栈跟踪更清晰。
    function factorial(n) {
        return n <= 1 ? 1 : n * factorial(n - 1); // 递归调用
    }
    console.log(factorial(5)); // 120

    // 2、函数表达式
    // 2.1 需要动态赋值或条件性定义：
    let isMorning = false;
    const greet2 = isMorning ? function() { console.log('Good morning!') } : function() { console.log('Hello!') };
    greet2(); // Hello!

    // 2.2 作为回调函数或立即调用（IIFE）：
    // setTimeout是JS内置的全局函数，用来设置延迟多长时间执行哪个函数
    // 语法格式：setTimeout(回调函数, 延迟多长时间单位毫秒);
    setTimeout(function() { console.log('Delayed'); }, 1000);
    // 立即调用函数表达式：定义后立即执行。
    (function() { console.log('Hello, world!'); })(); // Hello, world!

    // 3、箭头函数
    // 3.1 需要简洁的单行函数：
    const double = x => x * 2;
    console.log(double(5)); // 10
    /*
       箭头函数：没有自己的 this，继承父作用域的 this。
       什么时候使用箭头函数？需要继承外层 this的时候：你
       需要记住，箭头函数中的 this 永远继承的是外层作用域的 this，
       而普通函数有自己的 this 绑定。
    */
    // 箭头函数解决的经典问题：
    // 普通函数 this 丢失
    const obj = {
        name: "Alice",
        sayName: function() {
            setTimeout(function() {
                console.log(this.name); // ❌ undefined (this 指向 window) 这里是浏览器的定时器机制调用的，this 指向 window
            }, 100);
        }
    };
    obj.sayName(); // 输出: undefined

    // 箭头函数 this 保持
    const obj2 = {
        name: "Alice",
        sayName: function() {
            setTimeout(() => {
                console.log(this.name); // ✅ "Alice" (this 指向 obj)
            }, 100);
        }
    };
    obj2.sayName(); // 输出: "Alice"


</script>
</body>
</html>
