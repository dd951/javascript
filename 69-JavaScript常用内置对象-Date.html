<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日期对象</title>
</head>
<body>
    <script>
    // 1、new Date() - 创建日期对象
    let date = new Date(); // Tue Sep 15 2026 13:28:06 GMT+0800 (中国标准时间)
    console.log(date);

    // 2、 getFullYear() / getMonth() / getDate() - 获取年月日
    console.log(date.getFullYear()); // 2026
    console.log(date.getMonth()); // 8 - 9月 从0开始计数
    console.log(date.getDate()); // 15
    
    // 3、 getHours() / getMinutes() / getSeconds() - 获取时分秒
    console.log(date.getHours()); // 13
    console.log(date.getMinutes()); // 28
    console.log(date.getSeconds()); // 06
    
    // 4、 getTime() - 时间戳。Date.now()也可以。
    console.log(date.getTime()); // 1794824886000
    
    // 5、 getDay() - 星期几
    console.log(date.getDay()); // 2 - 2表示星期二
    
    // 6、 toISOString() - 转ISO格式字符串
    console.log(date.toISOString()); // 2026-09-15T15:28:06.000Z
    
    // 7、 toLocaleString() - 本地化字符串
    console.log(date.toLocaleString()); // 2026/9/15 13:28:06
    
    // 8、 setFullYear() / setMonth() / setDate() - 设置年月日
    date.setFullYear(2025, 0, 1);
    console.log(date);
    date.setMonth(11, 12); // 12月12日
    console.log(date);
    date.setDate(10, 10); // 11月10日
    console.log(date);

    
    // 9、 setHours() / setMinutes() / setSeconds() - 设置时分秒
    date.setHours(12, 0, 0); // 12:00:00
    console.log(date);
    date.setMinutes(30, 0); // 12:30:00
    console.log(date);
    date.setSeconds(30); // 12:30:30
    console.log(date);
    </script>
</body>
</html>
