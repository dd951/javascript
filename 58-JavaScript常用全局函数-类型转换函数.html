<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript常用全局函数-类型转换函数</title>
</head>
<body>
    <script>
        // 1、类型转换函数
        // 1.1 Boolean() 将值转为布尔类型
        console.log(Boolean('hello')); // true
        console.log(Boolean('')); // false
        console.log(Boolean(null)); // false
        console.log(Boolean(0)); // false
        console.log(Boolean(1)); // true
        let bool = new Boolean('');
        console.log(bool); // false

        // 1.2 Number() 将值转为数字类型
        console.log(Number('123')); // 123
        console.log(Number('123abc')); // NaN
        console.log(Number('123.456')); // 123.456

        // 1.3 String() 将值转为字符串类型
        console.log(String(123)); // '123'
        console.log(String('hello23')); // 'hello23'
        console.log(String(true)); // 'true'

        // 1.4 BigInt() 将值转为大整数类型
        console.log(BigInt(123)); // 123n
        console.log(BigInt('123')); // 123n

        // 1.5 Symbol() 将值转为符号类型
        console.log(Symbol('hello')); // Symbol(hello)
    </script>
</body>
</html>
