<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>window对象</title>
</head>
<body>
    <script>
        /* 
        BOM 是 JavaScript 与浏览器交互的核心模型，它提供了一组对象和方法，
        用于操作浏览器窗口、导航、历史记录、屏幕等与网页内容无关的浏览器功能。
        （注意：BOM 不是 W3C 标准，不同浏览器实现可能有差异，但核心功能基本一致。）

        全局作用域：window 是 BOM 的顶层对象，所有全局变量和函数都是 window 的属性和方法。
        常用属性和方法：
        - window.innerWidth / window.innerHeight：视口尺寸。
        - window.open() / window.close()：打开/关闭窗口。
        - window.alert()、window.prompt()、window.confirm()：用户交互对话框。
        */
    </script>
</body>
</html>
