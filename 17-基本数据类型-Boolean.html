<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Boolean</title>
</head>
<body>
<script>
    // 布尔类型
    // 1、true 真
    let bool1 = true;
    console.log(bool1);
    console.log(typeof bool1); // boolean

    // 2、false 假
    let bool2 = false;
    console.log(bool2);
    console.log(typeof bool2); // boolean
</script>
</body>
</html>
