<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>比较运算符</title>
</head>
<body>
<script>
    /*
         == 等于
         === 严格等于（既比较值又比较数据类型，开发中建议使用严格等于。）
         != 不等于
         !== 严格不等于
         > 大于
         < 小于
         >= 大于等于
         <= 小于等于
     */

    // ==
    console.log(1 == '1'); // true
    // ===
    console.log(1 === '1'); // false
</script>
</body>
</html>
