<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BigInt</title>
</head>
<body>
<script>
    // 大整数类型
    // 表示任意精度的整数，用于超出 Number 安全范围的大整数（后缀加 n）。
    let bigNum = 9007199254740991n;
    console.log(bigNum);
    console.log(typeof bigNum); // bigint
</script>
</body>
</html>
