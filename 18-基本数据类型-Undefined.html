<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Undefined</title>
</head>
<body>
<script>
    // 未定义类型
    let undefined1; // 表示变量已声明但未赋值时的默认值（undefined）
    console.log(undefined1); // undefined
    console.log(typeof undefined1); // undefined
</script>
</body>
</html>
