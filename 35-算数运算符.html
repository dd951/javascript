<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>算术运算符</title>
</head>
<body>
<script>
    /*
        + 加法
        - 减法
        * 乘法
        / 除法
        % 取模（余数）
        ** 指数（ES2016）【比如2的3次方，可以使用2 ** 3来计算。以前是版本是调用Math.pow(2, 3)函数】
        ++ 递增
        -- 递减
        + 一元正号
        - 一元负号
    */

    // ** 指数（ES2016）
    console.log(2 ** 3); // 8
    console.log(Math.pow(2, 3)); // 8
</script>
</body>
</html>
