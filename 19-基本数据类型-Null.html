<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Null</title>
</head>
<body>
<script>
    // 空类型
    // 表示空值（null），通常用于显式的清空变量。
    // 注意：typeof null 返回 "object"（历史遗留问题：虽然结果是object，但仍然归类到基本数据类型范畴）
    let null1 = null;
    console.log(null1);
    console.log(typeof null1); // object
</script>
</body>
</html>
