<!DOCTYPE html>
<html>
<body>
    <div id="time"></div>

    <script>

        // setInterval 周期性的执行某个任务

        function updateTime() {
            const now = new Date();
            document.getElementById('time').textContent = now.toLocaleString(); // 改成本地化格式的时间字符串
        }
        
        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
