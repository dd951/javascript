<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie的用途</title>
</head>
<body>
    <script>
        /* 
        - 会话管理（如用户登录状态）：HTTP 协议是一个无状态协议，一次请求响应结束之后，通道就断开了。
        服务器无法知道客户的状态，因此 HTTP 协议是无状态的。这里不要误解哈：HTTP 协议是一个有连接的
        协议，可靠的协议，但它是一种无状态的。既然是无状态的，那么当用户登录成功之后，服务器怎么知道
        该用户一直是一种已登录的状态呢？传统的实现方式是：当用户第一次登录成功后，服务器会向浏览器响
        应一个 Cookie，这个 Cookie 中保存了会话 id，只要浏览器不关闭，下一次发送请求时会自动携带 
        Cookie 到服务器，服务器获取到会话 id 之后，验证会话 id 是否有效，如果有效则表示该用户已登录，
        这样就可以一直保持住会话的状态了。（现代开发一般向浏览器响应一个带有 HttpOnly 标志的 Cookie，
        Cookie 中不存放会话 id，存放 token 令牌。）

        - 跟踪用户行为（如广告推荐）。当用户首次访问网站时，服务器通过Set-Cookie响应头为用户分配一个
        唯一标识符（如user_id=abc123）。随后用户在每个页面的浏览和点击行为都会通过请求自动携带这个
        cookie发送到服务器，服务器将行为数据与user_id关联存储。通过分析这些累积的用户行为数据，
        广告系统可以构建用户兴趣画像，在后续访问中展示个性化推荐广告。
        */
    </script>
</body>
</html>
