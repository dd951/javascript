<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>基本数据类型与引用数据类型的区别</title>
</head>
<body>
<script>
    /*
    特性  基本数据类型  引用数据类型
    存储方式    栈内存（直接存储值）    堆内存（存储地址）
    可变性    不可变（值本身）    可变（可修改属性）
    比较    比较值（1 === 1）    比较地址（{} === {}结果是 false，{}=={}结果还是 false。）
     */

    // 1、基本数据类型的比较
    let num1 = 10;
    let num2 = 10;
    console.log(num1 === num2); // true
    console.log(num1 == num2); // true

    // 2、引用数据类型的比较
    let obj1 = {
        name: 'zhou'
    };
    let obj2 = {
        name: 'zhou'
    };
    console.log(obj1 === obj2); // false
    console.log(obj1 == obj2); // false
</script>
</body>
</html>
