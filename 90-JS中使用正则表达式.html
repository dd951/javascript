<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS中使用正则表达式</title>
</head>

<body>
    <script>
        /*
         1、字面量方式 const regex = /pattern/flags;
         对于已知的、固定的模式，推荐使用字面量方式，语法更简洁
         使用斜杠 / 包围正则表达式模式
         */
        // 匹配所有数字
        const numberRegex = /\d+/g;
        console.log(numberRegex);

        // 匹配邮箱
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        console.log(emailRegex);

        /*
        2、构造函数方式 当需要动态构建正则表达式时（如基于用户输入），
        必须使用构造函数方式使用 RegExp 构造函数
        
        const regex = new RegExp('pattern', 'flags');
        console.log(regex);
        */

        // 匹配所有数字
        const numberRegex2 = new RegExp('\\d+', 'g');
        console.log(numberRegex2);

        // 动态创建正则表达式
        const searchTerm = 'hello';
        const dynamicRegex = new RegExp(searchTerm, 'i');
        console.log(dynamicRegex);

        /*
        常用标志（flags）
        - i - 忽略大小写
        - g - 全局匹配（查找所有匹配而非在第一个匹配后停止）【不会以换行符作为分界点】
        - m - 多行模式 【会以换行符作为分界点】
        */

        // g和 m的区别：举例
        const str = "a1\na2\na3";

        // 字符串都有match方法，字符串的match方法返回数组，这个数组中都是能够匹配上正则表达式的字符串。
        console.log(str.match(/^a\d/g));   // ["a1"]

        console.log(str.match(/^a\d/gm));  // ["a1", "a2", "a3"]


    </script>
</body>

</html>
