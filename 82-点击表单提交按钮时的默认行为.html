<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>点击表单提交按钮时的默认行为</title>
</head>

<body>

    <form action="http://localhost:80/login" method="get" id="userForm">
        用户名：<input type="text" name="username" required><br>
        密码：<input type="password" name="password" required><br>
        <button>登录</button>
    </form>

    <script>

        /* 
        当点击表单的提交按钮时，首先会触发表单的 submit 事件，当事件发生之后，浏览器会有
        默认行为：向 web 服务器提交表单数据并发送请求(http://localhost/login?username=张三&password=1234)。如果你想阻止浏览器的这个默认行为可
        以调用：event.preventDefault();
        */
        const userForm = document.getElementById('userForm');
        userForm.addEventListener('submit', function (event) {
            console.log('表单提交事件发生了');
            event.preventDefault(); // 阻止表单默认提交行为
        });
    </script>

</body>

</html>
