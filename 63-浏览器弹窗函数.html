<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浏览器弹窗函数</title>
</head>
<body>
    <script>
        // 1、alert() 警告弹窗 - 显示一个简单的弹窗，提示用户输入
        alert("小心操作，避免误操作")

        // 2、prompt() 输入弹窗 - 显示一个简单的弹窗，提示用户输入
        const name = prompt("请输入您的姓名")
        console.log(name)
        
        // 3、confirm() 确认弹窗 - 显示一个简单的弹窗，提示用户确认
        const isConfirm = confirm("确认操作吗？") // 确认返回true，取消返回false
        console.log(isConfirm)
    </script>
</body>
</html>
